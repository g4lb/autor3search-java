name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: build
        run: mvn -B --no-transfer-progress -DskipTests package
      # The end-to-end tests drive real Maven and Gradle builds and real forked
      # benchmark JVMs. They are the only thing that proves the harness can drive
      # a build tool at all, so they run on every JDK in the matrix rather than
      # being relegated to one.
      - name: test
        run: mvn -B --no-transfer-progress test
      - name: the jar runs
        run: java -jar target/autor3search-java.jar version

  # macOS is a first-class target: it is where most of this will actually be run
  # from, and it is the platform whose P/E core scheduling `doctor` warns about.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Ubuntu and macOS runners ship Gradle; the Windows image does not, and the
      # Gradle end-to-end test skips itself when it cannot find one. Skipping is
      # honest but it left the one build tool whose launcher name differs by
      # platform (gradle.bat) unexercised on the only platform where that matters.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: mvn -B --no-transfer-progress test

  # Windows is a target the code goes out of its way not to exclude — the run
  # claim is a FileChannel lock, process trees come from ProcessHandle, and the
  # build wrappers are resolved as .cmd/.bat — but nothing had ever run there.
  # This job guards what can run: everything except the tests that drive `sh`,
  # which are the tests' limitation and not the harness's.
  windows:
    runs-on: windows-latest
    steps:
      # Before the checkout, and the reason this job has an extra step at all:
      # the Windows runner image sets core.autocrlf=true, which would rewrite
      # every checked-out file to CRLF. The freeze package hashes file contents
      # byte for byte, so that rewrite alone would fail tests that have nothing
      # wrong with them, on this platform only.
      - run: git config --global core.autocrlf input
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Ubuntu and macOS runners ship Gradle; the Windows image does not, and the
      # Gradle end-to-end test skips itself when it cannot find one. Skipping is
      # honest but it left the one build tool whose launcher name differs by
      # platform (gradle.bat) unexercised on the only platform where that matters.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: mvn -B --no-transfer-progress test
