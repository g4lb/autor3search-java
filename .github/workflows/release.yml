name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A step `if` cannot read the `secrets` context — that is a schema error that
      # fails the workflow before any job starts, with no log to explain it. Job-level
      # env can read secrets, and a step `if` can read env, so the presence check for
      # the signing key is hoisted here.
      HAS_SIGNING_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # Writes ~/.m2/settings.xml with a `central` server whose credentials
          # come from the env vars below, and imports the signing key, so the
          # release profile's gpg + central-publishing plugins find both.
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # A tag that disagrees with the pom publishes a version nobody can check
      # out, and Maven Central releases are immutable. Fail before uploading.
      - name: the tag must be the version it claims to be
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(mvn -B -q --no-transfer-progress \
            help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pom version $version" >&2
            exit 1
          fi
          echo "publishing $version"

      # The same gate ci.yml runs. A release is not the place to find out that
      # the tagged commit does not pass its own tests.
      - name: test
        run: mvn -B --no-transfer-progress test

      # A results.tsv row is only as reproducible as the binary that produced it,
      # so the commit is stamped into the jar and `version` reports it back.
      - name: build the release jar
        run: |
          mvn -B --no-transfer-progress -DskipTests \
            -DbuildCommit="$(git rev-parse --short HEAD)" package
          java -jar target/autor3search-java.jar version

      # Signs, attaches sources + javadoc, uploads to the Central Portal and
      # waits for it to go live. Skipped when the signing key is absent so a
      # fork's tag push degrades to a GitHub release instead of failing.
      - name: publish to Maven Central
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_KEY == 'true' }}
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B --no-transfer-progress -Prelease -DskipTests \
            -DbuildCommit="$(git rev-parse --short HEAD)" deploy

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            target/autor3search-java.jar \
            bin/autor3search-java
